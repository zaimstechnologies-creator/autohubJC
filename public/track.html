<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Your Vehicle | Al Shaheen Auto Hub</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/logo.png">
    <style>
        body {
            background: linear-gradient(135deg, #0b1329 0%, #162544 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .track-box {
            background: #ffffff;
            border-radius: 20px;
            width: 100%;
            max-width: 540px;
            padding: 34px 28px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .track-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .track-header img {
            height: 52px;
            margin-bottom: 12px;
        }
        .track-header h1 {
            font-size: 20px;
            font-weight: 800;
            color: var(--navy-dark);
        }
        .track-header p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }
        .search-group {
            display: flex;
            gap: 10px;
            margin-bottom: 24px;
        }
        .search-group input {
            flex: 1;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 700;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            text-transform: uppercase;
        }
        .search-group input:focus {
            border-color: var(--red-primary);
        }
        .track-result {
            display: none;
            border-top: 1px solid #e2e8f0;
            padding-top: 24px;
        }
        .status-hero {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 20px;
        }
        .status-hero .plate {
            display: inline-block;
            background: #0f172a;
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            padding: 4px 14px;
            border-radius: 6px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        .status-hero .model {
            font-size: 15px;
            font-weight: 800;
            color: var(--navy-dark);
        }
        .status-hero .bay-badge {
            display: inline-block;
            margin-top: 8px;
            background: #dbeafe;
            color: #1e40af;
            font-weight: 800;
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
        }
        .stepper {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 28px 0;
        }
        .stepper::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 20px;
            right: 20px;
            height: 3px;
            background: #e2e8f0;
            z-index: 1;
        }
        .step-node {
            position: relative;
            z-index: 2;
            text-align: center;
            flex: 1;
        }
        .step-dot {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #e2e8f0;
            color: #64748b;
            font-weight: 800;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 8px;
        }
        .step-node.completed .step-dot {
            background: #10b981;
            color: #fff;
        }
        .step-node.active .step-dot {
            background: var(--red-primary);
            color: #fff;
            box-shadow: 0 0 0 4px rgba(192, 20, 38, 0.2);
        }
        .step-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-muted);
        }
        .step-node.active .step-title {
            color: var(--navy-dark);
        }
    </style>
</head>
<body>

    <div class="track-box">
        <div class="track-header">
            <img src="/logo.png" alt="Al Shaheen Auto Hub" onerror="this.src='logo.png'">
            <h1>Vehicle Service Tracker</h1>
            <p>Live status direct from Al Shaheen Auto Hub workshop</p>
        </div>

        <div class="search-group">
            <input type="text" id="trackSearchInput" placeholder="Enter Registration No (e.g. AQP 007)" onkeydown="if(event.key==='Enter') executeTrack()">
            <button type="button" class="btn-primary" onclick="executeTrack()">Track ➔</button>
        </div>

        <div class="track-result" id="trackResult">
            <div class="status-hero">
                <div class="plate" id="resPlate">AQP 007</div>
                <div class="model" id="resModel">Mazda Flair (2022)</div>
                <div class="bay-badge" id="resBay">Currently at Bay 1: Diagnostics</div>
            </div>

            <div class="stepper">
                <div class="step-node completed" id="step1">
                    <div class="step-dot">✓</div>
                    <div class="step-title">Checked In</div>
                </div>
                <div class="step-node active" id="step2">
                    <div class="step-dot">2</div>
                    <div class="step-title">In Service Bay</div>
                </div>
                <div class="step-node" id="step3">
                    <div class="step-dot">3</div>
                    <div class="step-title">Quality Check</div>
                </div>
                <div class="step-node" id="step4">
                    <div class="step-dot">4</div>
                    <div class="step-title">Ready / Delivery</div>
                </div>
            </div>

            <div style="background:#f1f5f9; border-radius:10px; padding:16px; margin-top:20px; font-size:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                    <span style="color:#64748b;">Service Advisor:</span>
                    <strong id="resAdvisor">Service Incharge</strong>
                </div>
                <div style="display:flex; justify-content:space-between;">
                    <span style="color:#64748b;">Contact Workshop:</span>
                    <a href="https://wa.me/923441411123" target="_blank" style="color:#16a34a; font-weight:700; text-decoration:none;">💬 WhatsApp Advisor</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/js/toast.js"></script>
    <script src="/js/api.js"></script>
    <script>
        async function executeTrack() {
            const query = (document.getElementById('trackSearchInput').value || '').trim().toLowerCase().replace(/[^a-z0-9]/g, '');
            const resultBox = document.getElementById('trackResult');

            if (!query) {
                showToast('Please enter your vehicle registration number.', 'error');
                return;
            }

            let found = null;
            if (window.HubAPI && typeof window.HubAPI.trackVehicle === 'function') {
                const res = await window.HubAPI.trackVehicle(query);
                if (res && res.success && res.data) {
                    found = res.data;
                }
            } else {
                try {
                    const r = await fetch(`/api/public/track?q=${encodeURIComponent(query)}`);
                    const j = await r.json();
                    if (j.success && j.data) found = j.data;
                } catch (e) {
                    showToast('Unable to reach the workshop tracking service. Please try again.', 'error');
                    return;
                }
            }

            if (!found) {
                showToast('No active vehicle record found for registration number: ' + query.toUpperCase(), 'error');
                return;
            }

            showToast('Vehicle status found.');
            resultBox.style.display = 'block';
            document.getElementById('resPlate').textContent = found.vehicle?.plateNo || 'REGISTRATION';
            document.getElementById('resModel').textContent = found.vehicle?.makeModel || 'Vehicle';
            document.getElementById('resAdvisor').textContent = found.serviceAdvisor || 'Service Incharge';

            const isReady = found.status === 'Ready' || found.currentBay === 'Bay 6';
            document.getElementById('resBay').textContent = isReady ? '✓ Ready for Key Collection (Bay 6)' : `Currently at ${found.currentBay || 'Bay 1'}`;

            // Stepper states
            const s1 = document.getElementById('step1');
            const s2 = document.getElementById('step2');
            const s3 = document.getElementById('step3');
            const s4 = document.getElementById('step4');

            s1.className = 'step-node completed';
            if (isReady) {
                s2.className = 'step-node completed';
                s3.className = 'step-node completed';
                s4.className = 'step-node active';
            } else {
                s2.className = 'step-node active';
                s3.className = 'step-node';
                s4.className = 'step-node';
            }
        }

        // Live real-time auto-refresh on customer's phone as soon as vehicle moves
        window.addEventListener('hub-data-updated', () => {
            if (document.getElementById('trackResult')?.style.display === 'block') {
                executeTrack();
            }
        });
    </script>
</body>
</html>
